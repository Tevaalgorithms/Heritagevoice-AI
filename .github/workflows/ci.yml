name: checks
# Pull requests run once; pushes only run on main (which deploys) and on release tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A real PostgreSQL for the keyword-search tests (a database named *_test, reset by the tests).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: heritagevoice
          POSTGRES_PASSWORD: ci-only-test-db
          POSTGRES_DB: heritagevoice_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U heritagevoice -d heritagevoice_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HERITAGEVOICE_TEST_DATABASE_URL: postgresql+psycopg://heritagevoice:ci-only-test-db@localhost:5432/heritagevoice_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run xenon --max-absolute A --max-modules A --max-average A app ingestion frontend
      - run: uv run pytest
      - run: |
          uv export --locked --no-header --no-dev --format requirements-txt --output-file /tmp/requirements.txt
          diff requirements.txt /tmp/requirements.txt

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Scans the whole history every time; require this check in branch protection.
      - run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.24.3 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t heritagevoice:ci .
      - name: Scan for fixable high and critical vulnerabilities
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1
          image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          heritagevoice:ci
      - name: Validate the deployment compose file
        run: |
          mkdir -p "$RUNNER_TEMP/cfg" && touch "$RUNNER_TEMP/cfg/app.env" "$RUNNER_TEMP/cfg/secrets.toml"
          HV_CONFIG_DIR="$RUNNER_TEMP/cfg" POSTGRES_PASSWORD=ci-only HV_DOMAIN=example.org \
            docker compose -f deploy/docker-compose.yml config --quiet
      - name: Validate the Caddyfile
        run: |
          docker run --rm -e HV_DOMAIN=example.org -v "$PWD/deploy/Caddyfile":/etc/caddy/Caddyfile:ro \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra
      - name: Validate each stack
        run: |
          for dir in infra/cognito infra/single-instance infra/github-oidc; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Lint the workflow files
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.4 -color=false
