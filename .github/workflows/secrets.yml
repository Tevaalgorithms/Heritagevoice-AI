# Creates the app's generated secrets in Parameter Store. Run once after `infra` has applied the
# single-instance stack. Secret values never touch Terraform or its state: they are generated on
# the runner (or read from Cognito), masked in the log, and written straight to SecureString
# parameters. An existing parameter is never overwritten, so re-running is safe.
#
# Provider keys (LLM, Pinecone) are NOT handled here. Paste them into Parameter Store yourself
# (console), so they never pass through a workflow input or a log.
name: secrets

on:
  workflow_dispatch:

concurrency:
  group: infra
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap-secrets:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: infra # requires approval
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENVIRONMENT: ${{ vars.TF_ENVIRONMENT }}
      USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      APP_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: heritagevoice-secrets
      - name: Create missing secrets
        run: |
          set -euo pipefail
          path="/heritagevoice/${ENVIRONMENT}"

          put_if_missing() {
            local name="$1" value="$2"
            echo "::add-mask::$value"
            if aws ssm get-parameter --name "$path/$name" >/dev/null 2>&1; then
              echo "$name already exists, left unchanged"
              return
            fi
            aws ssm put-parameter --type SecureString --key-id "alias/heritagevoice-${ENVIRONMENT}" \
              --name "$path/$name" --value "$value" >/dev/null
            echo "$name created"
          }

          put_if_missing POSTGRES_PASSWORD "$(openssl rand -hex 16)"
          put_if_missing HV_COOKIE_SECRET "$(openssl rand -hex 24)"
          client_secret="$(aws cognito-idp describe-user-pool-client --user-pool-id "$USER_POOL_ID" \
            --client-id "$APP_CLIENT_ID" --query UserPoolClient.ClientSecret --output text)"
          put_if_missing HV_COGNITO_CLIENT_SECRET "$client_secret"
