# Deploys to the instance on every merge to main (once the CI checks workflow has passed on that
# commit), when a v* tag is pushed, or from a typed manual run. Every deploy that follows a merge to
# main is then tagged (next patch version) and gets a GitHub Release with generated notes, so the
# releases list always matches what is live. CI packs the code into a tarball, uploads it to a
# private S3 bucket and runs the deploy script on the instance through AWS Systems Manager. The
# instance pulls with its own role, so it never needs GitHub credentials (the repository is private).
# Authentication is OpenID Connect: no AWS keys are stored in GitHub.
#
# One-time setup (see docs/runbooks/deploy-single-instance.md): create the GitHub environment
# "prod" and these environment variables (required reviewers need a paid GitHub plan on a
# private repo, so the typed confirmation below is the check):
#   AWS_DEPLOY_ROLE_ARN, AWS_REGION, INSTANCE_ID, SITE_DOMAIN, RELEASES_BUCKET
name: deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or branch to deploy
        required: true
        default: main
      confirm:
        description: Type deploy to confirm
        required: true
  push:
    tags: ["v*"] # a named release; also creates the GitHub Release
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main] # continuous deployment: every merge to main that passes CI

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Tags and green merges to main deploy by themselves; a manual run must be confirmed.
    if: >
      github.event_name == 'push' || inputs.confirm == 'deploy' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    permissions:
      id-token: write
      contents: read
      checks: read
    env:
      INPUT_REF: ${{ inputs.ref }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate the ref
        id: ref
        run: |
          ref="${INPUT_REF:-${RUN_SHA:-$GITHUB_REF_NAME}}"
          [[ "$ref" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "Invalid ref" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Only deploy commits that are on main
        run: git merge-base --is-ancestor HEAD origin/main || { echo "This commit is not on main" >&2; exit 1; }

      - name: Require green CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100")"
          failed="$(jq '[.check_runs[] | select(.name | IN("checks","secrets","image","terraform")) | select(.conclusion | IN("failure","cancelled","timed_out","action_required"))] | length' <<<"$runs")"
          passed="$(jq '[.check_runs[] | select(.name | IN("checks","secrets","image","terraform")) | select(.conclusion == "success") | .name] | unique | length' <<<"$runs")"
          echo "commit $sha: $passed of 4 checks passed, $failed failed (runs still in progress are ignored)"
          [[ "$passed" == "4" && "$failed" == "0" ]] || { echo "CI is not green for this commit" >&2; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: heritagevoice-deploy

      - name: Package and upload the release
        id: release
        env:
          RELEASES_BUCKET: ${{ vars.RELEASES_BUCKET }}
        run: |
          release="$(git rev-parse --short=12 HEAD)"
          git archive --format=tar.gz --output release.tar.gz HEAD
          aws s3 cp --only-show-errors release.tar.gz "s3://$RELEASES_BUCKET/releases/$release.tar.gz"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          REF: ${{ steps.ref.outputs.ref }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $REF" \
            --timeout-seconds 1200 \
            --parameters "commands=[\"/usr/local/bin/hv-deploy $RELEASE\"]" \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -n 60
                echo "Deploy $status" >&2
                exit 1 ;;
            esac
            sleep 10
          done
          [[ "$status" == "Success" ]] || { echo "Deploy did not finish in time" >&2; exit 1; }
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -n 15

      - name: Smoke test
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "https://$SITE_DOMAIN/ready"; then echo; echo "Site is ready"; exit 0; fi
            sleep 10
          done
          echo "Site did not become ready" >&2
          exit 1

  # Creates the GitHub Release (the Releases box on the repo page) after a tag deployed cleanly.
  release:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"

  # Tags the commit that has just gone live: the next patch version after the newest v* tag, plus a
  # GitHub Release whose notes list every merged PR since the previous release. Tags made with the
  # workflow token do not start another workflow, so this never triggers a second deploy. A commit
  # that already has a v* tag (a manual release) is left alone. Bigger version jumps: push the tag.
  tag:
    needs: deploy
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release the deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "No deployed commit to tag" >&2; exit 1; }
          existing="$(git tag --points-at "$SHA" --list 'v*')"
          if [[ -n "$existing" ]]; then echo "Already tagged: $existing"; exit 0; fi
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          IFS=. read -r major minor patch <<<"${latest#v}"
          tag="v${major:-0}.${minor:-1}.$(( ${patch:-0} + 1 ))"
          echo "Tagging $SHA as $tag (previous: ${latest:-none})"
          gh release create "$tag" --target "$SHA" --generate-notes --title "$tag"
