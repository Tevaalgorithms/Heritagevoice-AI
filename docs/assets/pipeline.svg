  <text x="50" y="108" font-size="58" font-weight="800" fill="#ffffff">HeritageVoice <tspan fill="#f5b740">AI</tspan></text>
  <text x="50" y="152" font-size="23" fill="#e8ebfa">Preserving languages, stories and human knowledge</text>
